version: '3.9'
services:
  ptgen:
    build: .
    container_name: ptgen
    ports:
      - "53000:53000"
    environment:
      PTGEN_ADMIN_USER: admin
      PTGEN_ADMIN_PASSWORD: admin123
      PTGEN_JWT_SECRET: change-this-in-production
      PTGEN_PY_CMD: python3 /app/ptgen.py
    volumes:
      - ./data:/data
    restart: unless-stopped
